<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkMind AI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div id="landing-page">
        <div class="main-title">LinkMind AI</div>
        <div class="sub-title">Paste a link. Hit Enter. Talk to the web.</div>
        
        <div class="url-input-container">
            <span>🔗</span>
            <input type="text" id="urlInput" placeholder="Paste any link here (Website, Article, Video...)" autocomplete="off">
            <button id="analyzeBtn" class="analyze-btn">
                <div class="btn-spinner"></div>
                <span class="btn-text">Analyze ✨</span>
            </button>
        </div>
        
        <div id="status-container">
            <div id="loading-spinner" class="spinner"></div>
            <div id="status-msg"></div>
        </div>
    </div>

    <div id="chat-page">
        <div class="chat-header">
            <div class="active-url-badge" id="activeUrlText">Synched</div>
            <button class="close-btn" onclick="resetApp()">✖ Close</button>
        </div>

        <div class="link-preview-card" id="linkPreviewCard">
            <div class="preview-img-container">
                <span id="previewEmoji">🌐</span>
                <img id="previewImg" src="" alt="Thumbnail">
            </div>
            <div class="preview-info">
                <div class="preview-title" id="previewTitle">Extracting Content...</div>
                <div class="preview-desc" id="previewDesc">Preparing knowledge base for this link.</div>
            </div>
        </div>
        
        <div class="chat-box" id="chatBox"></div>

        <div class="chat-input-container">
            <input type="text" id="chatInput" placeholder="Ask a question about this website..." autocomplete="off">
            <button id="sendBtn" class="send-btn">Send</button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
